version: "3"
services:
    db:
        image: postgres:16
        restart: always
        volumes:
            - ./data/db:/var/lib/postgresql/data
        ports:
            - 5431:5432 # make sure you don't have another container running on 5432

        environment:
            - POSTGRES_DB=taskstack
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=admin123

    adminer:
        image: adminer
        restart: always
        ports:
            - 8080:8080
